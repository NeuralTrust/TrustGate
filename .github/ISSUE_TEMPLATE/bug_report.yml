name: Bug Report
description: Report a bug in TrustGate
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us understand and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start TrustGate with `make up`
        2. Create a gateway with `curl ...`
        3. Send a request to the proxy
        4. See error
    validations:
      required: true

  - type: dropdown
    id: plane
    attributes:
      label: Affected Plane
      description: Which TrustGate plane is affected?
      options:
        - Admin (:8080)
        - Proxy (:8081)
        - MCP (:8082)
        - All / Multiple
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: TrustGate Version
      description: Run `curl localhost:8080/__/version` or check `git describe --tags`
      placeholder: "v1.2.3 or commit hash"
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - Docker Compose (make up)
        - Local binary (make run-*)
        - Kubernetes
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Include any relevant log output. Use `make logs` for Docker Compose.
      render: shell
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context about the problem (screenshots, config snippets, etc.)
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I am using a supported version of TrustGate
          required: false
