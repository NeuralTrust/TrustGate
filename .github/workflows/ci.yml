name: CI

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  license-check:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: Install addlicense
        run: go install github.com/google/addlicense@v1.2.0
      - name: Check license headers
        run: make license-check

  unit-tests:
    uses: NeuralTrust/workflows/.github/workflows/tests.yml@main
    # tests.yml's lint and test jobs both request contents: read + id-token: write.
    permissions:
      contents: read
      id-token: write
    with:
      language: go
      language_version: "1.27"
      lint_enabled: true
      # v2.13.x cannot load go1.27.2's stdlib export data ("could not import
      # internal/reflectlite"); v2.14.0 can. Keep in sync with the Makefile.
      golangci_version: v2.14.0
      coverage_enabled: true
      test_command: |
        go test -v -race -coverprofile=unit-coverage.txt -covermode=atomic ./pkg/...
      setup_commands: |
        cp .env.example .env

  metrics-module:
    name: Metrics Schema Module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: true
      - name: Build, vet and test pkg/metrics
        working-directory: pkg/metrics
        run: |
          go build ./...
          go vet ./...
          go test -race ./...
      - name: Lint pkg/metrics
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # v2.12.x bundles honnef.co/go/tools v0.7.0, whose IR builder panics
          # on go1.27 stdlib sources ("unexpected expr: *ast.KeyValueExpr").
          # v2.13.x bundles v0.8.1, which understands go1.27, but cannot load
          # go1.27.2's stdlib export data; v2.14.0 can.
          version: v2.14.0
          # Released golangci-lint binaries are built with an older Go than
          # this module's go1.27 directive and refuse to lint it; goinstall
          # recompiles it with the active setup-go toolchain so they match.
          install-mode: goinstall
          working-directory: pkg/metrics

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      postgres:
        image: postgres:13
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          check-latest: true
          cache: true

      - name: Install service check tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-tools

      - name: Wait for services to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..120}; do
            if PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres -c "SELECT 1;" > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            if [ $i -eq 120 ]; then
              echo "PostgreSQL failed to start after 120 seconds"
              exit 1
            fi
            echo "PostgreSQL is not ready yet, waiting... ($i/120)"
            sleep 1
          done

          echo "Waiting for Redis to be ready..."
          for i in {1..120}; do
            if redis-cli -h localhost -p 6379 ping > /dev/null 2>&1; then
              echo "Redis is ready!"
              break
            fi
            if [ $i -eq 120 ]; then
              echo "Redis failed to start after 120 seconds"
              exit 1
            fi
            echo "Redis is not ready yet, waiting... ($i/120)"
            sleep 1
          done

          echo "All services are ready!"

      - name: Copy environment files
        run: |
          cp .env.example .env
          cp .env.functional.example .env.functional

      - name: Inject functional test secrets
        run: |
          echo "" >> .env.functional
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env.functional

      - name: Create repository integration test database
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres \
            -c "CREATE DATABASE trustgate_repo_test;" || true

      - name: Create sensible exporter integration test database
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5432 -U postgres -d postgres \
            -c "CREATE DATABASE sensible_pg_test;" || true

      - name: Run Functional tests
        env:
          PG_TEST_URL: postgres://postgres:postgres@localhost:5432/trustgate_repo_test?sslmode=disable
        run: go test -tags functional -v -race -count=1 -p 1 ./tests/functional/... ./pkg/infra/database/migrations

      - name: Run Postgres exporter integration tests
        env:
          SENSIBLE_PG_TEST_DSN: postgres://postgres:postgres@localhost:5432/sensible_pg_test?sslmode=disable
        run: go test -tags integration -race -count=1 ./pkg/infra/telemetry/postgres/...

  scripts-tests:
    name: CI Scripts Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test metrics module version bump
        run: bash .github/scripts/next-metrics-version.test.sh

  security:
    uses: NeuralTrust/workflows/.github/workflows/sast.yml@main
    # sast.yml's trivy job inherits these and posts the findings PR comment.
    permissions:
      contents: read
      pull-requests: write
    with:
      gitleaks_enabled: true
      gosec_enabled: true
      gosec_args: "-severity high -exclude-dir=examples ./..."
      # gosec <= 2.22.x ships a golang.org/x/tools that cannot type-check
      # go1.27 packages and aborts with "package ... without types was
      # imported from command-line-arguments" before reporting anything.
      # 2.29.0 (x/tools v0.49.0) cannot read go1.27.2 export data ("export
      # data version 5 is greater than maximum supported"); gosec master at
      # d2b649ec (x/tools v0.51.0) can. Move to the next tagged release.
      gosec_version: "2.29.1-0.20261005092323-d2b649ec0182"
      govulncheck_enabled: true

  image-scan:
    if: github.base_ref == 'main' && github.head_ref == 'develop'
    uses: NeuralTrust/workflows/.github/workflows/image-scan.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      image_ref: europe-west1-docker.pkg.dev/${{ vars.DEV_GCP_PROJECT_ID }}/nt-docker/agentgateway:latest
      exit_code: '1'
      upload_sarif: true
    secrets:
      WIF_PROVIDER: ${{ secrets.DEV_WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ secrets.DEV_WIF_SERVICE_ACCOUNT }}
