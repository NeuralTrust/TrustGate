# Secret stores for the TrustGate data plane. Copy to secret-stores.yaml next
# to docker-compose.yml and start with:
#
#   docker compose -f docker-compose.yml -f docker-compose.secret-stores.yml up -d
#
# A registry credential can then be set, in the console, to a reference such
# as secret://local-files/llm/openai (the content of
# ./secrets/llm/openai) instead of the key itself. The key never leaves this
# host: the data plane reads it here and NeuralTrust only sees the reference.
#
# This file holds where to read secrets from, never a secret: credentials for
# a store come from mounted files or the workload identity.
version: 1
stores:
  # Files mounted read-only from ./secrets. Every path must start with one of
  # allowed_paths.
  - name: local-files
    type: file
    allowed_paths: ["llm/"]
    # Optional. When set, a value is sent only to these hosts (an exact host
    # or "*." and a domain); a reference whose entity sends it elsewhere stays
    # unresolved with destination_not_allowed. Leave it out to allow any host.
    # allowed_destinations: ["api.openai.com", "*.amazonaws.com"]
    file:
      root: /etc/trustgate/secrets

  # HashiCorp Vault or OpenBao, KV v2, with AppRole. Mount the secret id as a
  # file; the role id is not a secret.
  # - name: corp-vault
  #   type: hashicorp_vault
  #   allowed_paths: ["ai-gateway/"]
  #   hashicorp_vault:
  #     address: https://vault.internal:8200
  #     mount: secret
  #     kv_version: 2
  #     auth:
  #       method: approle
  #       role_id: 00000000-0000-0000-0000-000000000000
  #       secret_id_file: /etc/trustgate/vault/secret-id

  # AWS Secrets Manager with the host's or task's own credentials.
  # - name: aws
  #   type: aws_secrets_manager
  #   allowed_paths: ["prod/llm/"]
  #   aws_secrets_manager:
  #     region: eu-west-1

  # Azure Key Vault with the pod's workload or managed identity. client_id
  # picks a user-assigned identity.
  # - name: azure
  #   type: azure_key_vault
  #   allowed_paths: ["llm-"]
  #   azure_key_vault:
  #     vault_url: https://acme-ai.vault.azure.net
  #     client_id: 00000000-0000-0000-0000-000000000000

  # CyberArk Conjur with authn-jwt and the pod's ServiceAccount token, or
  # method api_key with login and api_key_file (a mounted Secret).
  # - name: conjur
  #   type: cyberark_conjur
  #   allowed_paths: ["ai-gateway/"]
  #   cyberark_conjur:
  #     url: https://conjur.internal
  #     account: acme
  #     auth:
  #       method: jwt
  #       service_id: trustgate
