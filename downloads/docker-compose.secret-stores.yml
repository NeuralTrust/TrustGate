# Adds secret stores to the data plane in docker-compose.yml. See
# secret-stores.example.yaml for the store file and how to start it.
services:
  dataplane:
    environment:
      SECRET_STORES_FILE: /etc/trustgate/secret-stores.yaml
    volumes:
      - ./secret-stores.yaml:/etc/trustgate/secret-stores.yaml:ro
      - ./secrets:/etc/trustgate/secrets:ro
