name: agentgateway

# Runs the TrustGate admin, proxy and MCP servers as containers.
# Meant to be combined with docker-compose.yaml (postgres/redis):
#   docker compose -f docker-compose.yaml -f docker-compose.api.yaml build admin
#   docker compose -f docker-compose.yaml -f docker-compose.api.yaml up -d
# Both files share the same project name, so these services join the same
# network and can reach the backing services by hostname.

x-server-common: &server-common
  image: agentgateway:local
  build:
    context: .
  env_file:
    - .env
  # Override localhost defaults so containers reach the compose services.
  environment:
    DB_HOST: postgres
    REDIS_HOST: redis
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  admin:
    <<: *server-common
    command: ["admin"]
    ports:
      - "8080:8080"

  proxy:
    <<: *server-common
    command: ["proxy"]
    ports:
      - "8081:8081"

  mcp:
    <<: *server-common
    command: ["mcp"]
    ports:
      - "8082:8082"
