apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: agentgateway
# config-sync gRPC public endpoint (hybrid data planes) + its cert-manager cert
# TEMPORARY PUBLIC EXPOSURE: publishes the proxy and MCP data paths on
# *.sandbox.neuraltrust.ai via the external gateway. Comment this line out to
# close the public endpoints again; nothing else needs to change.
resources:
- ../../base
- secretproviderclass/agentgateway-secrets.yaml
- service-configsync-external.yaml
- config-sync-cert.yaml
- external-exposure/agentgateway-routes-external.yaml
patchesStrategicMerge:
- patches/hpa-patch.yaml
- patches/resources-patch.yaml
- patches/pdb-patch.yaml
- patches/httproute-patch.yaml
- patches/sa-annotation-patch.yaml
- patches/config-sync-tls-patch.yaml
- patches/config-sync-internal-lb-patch.yaml
patches:
- patch: |-
    - op: remove
      path: /spec/replicas
  target:
    kind: Deployment
    name: agentgateway-admin
- patch: |-
    - op: remove
      path: /spec/replicas
  target:
    kind: Deployment
    name: agentgateway-proxy
- patch: |-
    - op: remove
      path: /spec/replicas
  target:
    kind: Deployment
    name: agentgateway-mcp
commonLabels:
  app.kubernetes.io/managed-by: kustomize
  environment: dev
namespace: agentgateway
images:
- name: agentgateway
  newName: europe-west1-docker.pkg.dev/neuraltrust-app-dev/nt-docker/agentgateway
  newTag: b855d10de7196d4f7edf5f05f0fdff9391506e6b
configMapGenerator:
- behavior: create
  envs:
  - config.env
  name: agentgateway-config
