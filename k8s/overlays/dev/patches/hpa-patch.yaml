# HPA patch for dev environment - agentgateway
# Admin is pinned to 2 replicas: every admin replica recompiles the config
# snapshot on every write, so extra replicas multiply the compile load on
# Postgres (and the compile CPU itself pushes the HPA into scaling up,
# feeding the loop) without adding any config-sync capacity.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentgateway-admin
spec:
  minReplicas: 2
  maxReplicas: 2
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 90
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: agentgateway-proxy
spec:
  minReplicas: 2
  maxReplicas: 5
  metrics:
