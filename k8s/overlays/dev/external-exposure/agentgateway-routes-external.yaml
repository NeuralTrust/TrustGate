# TEMPORARY PUBLIC EXPOSURE — dev only.
#
# Publishes the agentgateway proxy and MCP data paths on the public gateway so
# an external caller can reach the dev gateway without a tunnel. Close it again
# by commenting the external-exposure entry out of ../kustomization.yaml.
#
# Two deliberate narrowings versus the internal routes:
#
#   * The hostnames are *.sandbox.neuraltrust.ai, not *.dev.neuraltrust.ai. The
#     dev names exist in the Cloudflare zone with no public A record and resolve
#     only through Twingate (CGNAT space), and the external gateway's only
#     certificate is *.sandbox.neuraltrust.ai. Internal callers keep using the
#     .dev names, which are unchanged.
#
#   * The per-gateway wildcards (*.llm.… / *.mcp.…) are NOT published. That
#     certificate covers a single label, so a two-label name such as
#     acme.llm.sandbox.neuraltrust.ai would fail TLS. Publishing per-gateway
#     slugs needs those wildcards added to the gateway-tls-cert dnsNames in
#     core-infrastructure/gateway/overlays/dev/gateway-patch.yaml first.
#
#   * The admin API (agentgateway-admin) stays internal-only.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-proxy-route-external
  labels:
    app.kubernetes.io/name: agentgateway
    app.kubernetes.io/instance: agentgateway
    component: proxy
spec:
  parentRefs:
  - name: external-gateway
    namespace: gateway
  hostnames:
  - "agentgateway.sandbox.neuraltrust.ai"
  - "gateway-llm.sandbox.neuraltrust.ai"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: agentgateway-proxy
      port: 8081
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-mcp-route-external
  labels:
    app.kubernetes.io/name: agentgateway
    app.kubernetes.io/instance: agentgateway
    component: mcp
spec:
  parentRefs:
  - name: external-gateway
    namespace: gateway
  hostnames:
  - "agentgateway-mcp.sandbox.neuraltrust.ai"
  - "gateway-mcp.sandbox.neuraltrust.ai"
  - "*.mcp.sandbox.neuraltrust.ai"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: agentgateway-mcp
      port: 8082
