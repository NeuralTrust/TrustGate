apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: agentgateway-admin-healthcheck
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        port: 8080
        requestPath: /healthz
  targetRef:
    group: ""
    kind: Service
    name: agentgateway-admin
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: agentgateway-proxy-healthcheck
spec:
  default:
    checkIntervalSec: 15
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 2
    config:
      type: HTTP
      httpHealthCheck:
        port: 8081
        # Readiness, not liveness: a data-plane pod has nothing to serve until it
        # holds a config snapshot, and /readyz reports 503 until then.
        requestPath: /readyz
  targetRef:
    group: ""
    kind: Service
    name: agentgateway-proxy
---
