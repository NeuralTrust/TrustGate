apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentgateway-admin
  labels:
    app.kubernetes.io/instance: agentgateway
    app.kubernetes.io/component: admin
    component: admin
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: agentgateway
      app.kubernetes.io/component: admin
      component: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: agentgateway
        app.kubernetes.io/component: admin
        component: admin
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: agentgateway
      containers:
      - name: admin
        image: agentgateway
        workingDir: /app
        args:
        - admin
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: agentgateway-config
        ports:
        - containerPort: 8080
          name: http
        # Config-sync gRPC listener (CONFIG_SYNC_GRPC_LISTEN_ADDR): the control
        # plane serves compiled snapshots to the DB-less proxy/mcp data planes.
        - containerPort: 8083
          name: grpc
        # Snapshot compilation is a CPU burst on every config write, so the
        # limit has to leave room for it: at 200m the compile was throttled
        # and config propagation to the data planes took ~20s.
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        volumeMounts:
        - name: agentgateway-secrets
          mountPath: /etc/secrets
          readOnly: true
      securityContext: {}
      volumes:
      - name: agentgateway-secrets
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: agentgateway-secrets
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: component
                operator: In
                values:
                - admin
            topologyKey: kubernetes.io/hostname
