<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" fill="none">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="trustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Apps/SDKs Box -->
  <g filter="url(#shadow)">
    <rect x="20" y="40" width="140" height="100" rx="8" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="90" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">Apps / SDKs</text>
    <text x="90" y="95" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">OpenAI SDK</text>
    <text x="90" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Cursor / Claude</text>
    <text x="90" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Any HTTP client</text>
  </g>
  
  <!-- Arrow 1 -->
  <path d="M165 90 L225 90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>
  
  <!-- TrustGate Box (main) -->
  <g filter="url(#shadow)">
    <rect x="230" y="20" width="200" height="140" rx="10" fill="url(#trustGrad)"/>
    <text x="330" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="white">TrustGate</text>
    
    <!-- Inner boxes -->
    <rect x="245" y="62" width="170" height="28" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="330" y="81" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="white">Proxy :8081 " MCP :8082</text>
    
    <rect x="245" y="96" width="170" height="28" rx="4" fill="rgba(255,255,255,0.15)"/>
    <text x="330" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.9)">Auth " Rate Limit " Cache " Logs</text>
    
    <rect x="245" y="130" width="170" height="22" rx="4" fill="rgba(255,255,255,0.1)"/>
    <text x="330" y="145" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="rgba(255,255,255,0.8)">Admin :8080 ’ config</text>
  </g>
  
  <!-- Arrow 2 -->
  <path d="M435 90 L495 90" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Providers Box -->
  <g filter="url(#shadow)">
    <rect x="500" y="25" width="140" height="130" rx="8" fill="url(#boxGrad)" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="570" y="52" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#334155">LLM Providers</text>
    <text x="570" y="75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">OpenAI</text>
    <text x="570" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Anthropic</text>
    <text x="570" y="109" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Bedrock / Vertex</text>
    <text x="570" y="126" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">Groq / Mistral</text>
    <text x="570" y="143" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#64748b">+ MCP servers</text>
  </g>
  
  <!-- Arrow 3 (response) -->
  <path d="M495 105 L435 105" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowheadGreen)"/>
  <path d="M225 105 L165 105" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrowheadGreen)"/>
  <defs>
    <marker id="arrowheadGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#22c55e"/>
    </marker>
  </defs>
  
  <!-- Labels -->
  <text x="195" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">API key</text>
  <text x="465" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#64748b">routed</text>
  
  <!-- Tagline -->
  <text x="400" y="172" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Single binary " No runtime deps " 9+ providers</text>
</svg>