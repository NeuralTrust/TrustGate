progress_s4b:
  status: applied (8.1-8.4 done; 8.5 V1 done, V2-V5 pending: AWS credentials expired, no live calls)
  table_snapshot: 2026-09-25, docs.aws.amazon.com/bedrock/latest/userguide/prompt-caching.html + Nova model cards (micro/lite/pro/premier/2-lite)
  table: Claude 1h (system/messages/tools) opus-5-5, opus-5, fable-5-1, fable-5, mythos-5-1, mythos-5, sonnet-5, opus-4-8, opus-4-7, opus-4-6, opus-4-5, sonnet-4-6, sonnet-4-5, haiku-4-5; Claude 5m (all fields) 3-7-sonnet, 3-5-sonnet-20241022-v2; Nova 5m system+messages only (no tools) micro, lite, pro, premier, 2-lite; min tokens informational (Claude 512-4096, Nova 1K, Nova max 20K cached); GPT-5.6 on Bedrock is Responses-only, not a Converse entry
  notes: cacheCapabilityFor strips one of us-gov./us./eu./apac./jp./au./ca./global., lowercases, longest family prefix ending on '-'/':'/end; foundation-model/ and inference-profile/ ARNs resolve through the ID after the last '/', other ARNs and unknown -> none. applyCacheCapability runs in the SDK layer on the model actually sent (after EnforceModel, D7) before the first call; strips all / tools only / clears ttl. converseWithCachePointFallback retries that request once, only on a ValidationException naming a checkpoint (cachepoint / cache point / cache_control / cache checkpoint, or ttl with cach; case-insensitive) and only when a cachePoint was stripped. Review fix: no cachePoint memo (the process-wide memo keyed by model let one tenant's malformed native body, >4 checkpoints or 1h after 5m, disable caching for every tenant; unlisted models are stripped up front so the memo was otherwise dead); converseParams.cachePointsRejected removed; systemFoldMemo kept as it was. converseWithFallbacks nests cache inside system fold for Converse and ConverseStream; client.converseStream hook added for tests. stripCachePoints and foldSystemIntoFirstTurn write fresh slices so inputs already sent are never mutated. Native Bedrock passthrough bodies are not normalised (client's own error, per-request retry only).
  deviations: cacheCapability has a third field tools (design listed explicit, ttl1h); Nova 2 Lite added (not in design list); prefix match needs an ID boundary
  open: Bedrock's exact cachePoint rejection texts unverified live (matcher table built from reported messages); a listed model that really lacks caching in some Region costs a failed round trip per request (no memo, by design); application-inference-profile, provisioned-model and custom-model ARNs get no cachePoint (the model behind them would need a GetInferenceProfile / GetCustomModel lookup)
progress_s5:
  status: applied (9.1-9.5 done; 9.6 V1 done, V2-V5 pending)
  notes: GraftChangedFields(ad, original, baseline, mutated) patches only changed string values and tools into the client body; text is located by a probe decode (each non-blank string under text/content/refusal/input/instructions/system/output swapped for a numbered sentinel, so the decoder itself reports which values form System and each message and with which joiners), then split back per value by newline count; a message whose line count changed has only its content replaced from the full re-encode (smallest value holding only that message's text); tools are matched by name (name, function.name, custom.name, toolSpec.name; Bedrock cachePoint entries ride with the tool before them), unchanged kept byte for byte, changed/new from the re-encode, unmodelled tools kept in place; other top-level keys the tool change altered in the re-encode (parallel_tool_calls) are applied; every graft is verified by decoding it (must equal mutated or decode(encode(mutated))), else full re-encode. Works for Chat, Responses, Anthropic, Bedrock, Gemini and Cohere text; tools element graft for all but Gemini (whole tools value replaced). FilterTools moves a removed tool's marker to the nearest kept tool before it (longer TTL wins). Plugins take a Clone as baseline; promptcompression also grafts (its roundTripSafe veto on markers stays).
  deviations: FilterTools moves the marker to the nearest kept tool before the removed one (spec says "last retained tool"; same in the spec scenarios, differs only when kept tools follow the removed one); googlemodelarmor not on main; rawjson.go added beside graft.go/tools.go; response-rewrite usage tested buffered only (streamed responses are rewritten at post_response, which is async and never reaches the client)
  fallbacks: messages added/removed or any non-text/non-tools canonical field changed; text added to a message with no text value (tool-call-only assistant); a changed field whose values the decoder trims or prefixes (Anthropic tool_result block text, is_error); several values of one field in a container shared with another field (Responses assistant items folded into one turn, Anthropic user text beside tool_results when lines change); a string containing U+E000/U+E001; Gemini tools
  review_fixes: redaction plugins no longer graft (a substring leak guard cannot cover normalised, split or encoded copies), they send EncodeRequest of the masked request; graft leak guard removed (tool plugins change no text, compression only drops filler); one-pass pre-check refuses bodies nesting over 64 containers, over 250k values or whose raw index would rescan over 16x their size; leaf index keeps a parent tree instead of a path copy per leaf; duplicate-key check is a one-pass stack scan with no size cap; UnmodelledToolKinds (entries the adapter skips, Gemini non-declaration groups, names shared with more entries than modelled tools) drives tool_allowlist on every request, counting refused ones as removed; allowsUnmodelled needs a per-format built-in kind named exactly in allow_tools
  open: dangling tool_choice naming a removed tool is kept (pre-existing encoder behaviour); tool_allowlist rewriteEmpty still re-marshals the top-level map (sorted keys) and deletes only a top-level "tools" key (Bedrock toolConfig untouched)

