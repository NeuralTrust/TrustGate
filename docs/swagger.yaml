      - store
  /v1/gateways/{gateway_id}/store/requests/history:
    get:
      description: Returns the gateway's approved and denied MCP Store install requests,
        newest decision first.
      parameters:
      - description: Gateway id
        format: uuid
        in: path
        name: gateway_id
        required: true
        type: string
      produces:
