info:
  contact:
    email: support@neuraltrust.ai
    name: NeuralTrust
    url: https://neuraltrust.ai/contact
  description: Administrative API for managing gateways and their registries, policies,
    consumers and auth credentials.
  title: TrustGate Admin API
  version: "1.0"
paths:
  /__/version:
    get:
      description: Returns build/version information for the running binary.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_version.Info'
      summary: Build version
      tags:
      - system
  /{consumer_slug}/v1/chat/completions:
    post:
      consumes:
      - application/json
      description: 'Forwards an OpenAI Chat Completions request to the selected provider.
        Proxy plane route: /{consumer_slug}/v1/chat/completions. Other fixed routes
        include /v1/messages (Anthropic) and /v1/responses (OpenAI Responses). Inline
        consumers may authenticate with an api key via X-AG-API-Key, x-api-key, or
        Authorization: Bearer ag_….'
      parameters:
      - description: Consumer slug
        in: path
        name: consumer_slug
        required: true
        type: string
      - description: API key for inline consumers
        in: header
        name: X-AG-API-Key
        type: string
      - description: API key for inline consumers (Anthropic-compatible clients)
        in: header
        name: x-api-key
        type: string
      - description: Bearer ag_… for inline api-key auth, or Bearer JWT for OAuth2/OIDC
          consumers
        in: header
        name: Authorization
        type: string
      - description: Gateway slug when using header-based gateway discovery
        in: header
        name: X-AG-Gateway-Slug
        type: string
      - description: OpenAI Chat Completions request body
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
      summary: Proxy chat completion
      tags:
      - proxy
  /{slug}/connections:
    get:
      description: For an MCP consumer whose application identifies its end users
        (identity.source = app). Reports, per connectable server, whether the named
        end user is connected, needs to reconnect, or has not connected. Authenticated
        with the consumer's API key.
      parameters:
      - description: Consumer slug
        in: path
        name: slug
        required: true
        type: string
