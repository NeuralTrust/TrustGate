  /v1/mcp-servers-catalog:
    get:
      description: Returns the curated catalog of well-known remote MCP servers, used
        to prefill MCP registry creation.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg_api_handler_http_catalog.ListMCPServersResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
      security:
      - BearerAuth: []
      summary: List the MCP servers catalog
      tags:
      - catalog
  /v1/models-catalog:
    get:
      description: 'Returns the catalog of supported models, optionally filtered by
        provider. When gateway_id and registry_id are supplied, the list is narrowed
        to the models that registry''s credentials can actually use: AWS Bedrock registries
        are checked against the AWS control plane (on-demand base models and system-defined
        inference profiles), and every other provider is checked against its authenticated
        models listing (so org-restricted API keys and Azure deployments are respected).
        Malformed ids, providers without a listing, and unreachable provider endpoints
        are ignored and yield the full catalog.'
      parameters:
      - description: Filter by provider id
        in: query
        name: provider
        type: string
      - description: Gateway of the registry to scope availability to
        format: uuid
        in: query
        name: gateway_id
        type: string
      - description: Registry whose credentials decide model availability
        format: uuid
        in: query
        name: registry_id
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_catalog_response.ModelResponse'
              type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
      security:
      - BearerAuth: []
      summary: List model catalog
      tags:
      - catalog
  /v1/playground/traces/{trace_id}:
    get:
      description: Returns the metrics Event captured for a playground request, keyed
        by the X-AG-Trace-Id returned in the proxy response. Traces expire after a
        short TTL.
      parameters:
      - description: Trace id (X-AG-Trace-Id from the proxy response)
        in: path
        name: trace_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_infra_metrics_events.Event'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
      security:
      - BearerAuth: []
      summary: Get a playground trace
      tags:
      - playground
  /v1/policies-catalog:
    get:
      description: Returns the catalog of available policies grouped by type. Each
        entry includes the settings schema needed to render its configuration form
        dynamically.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_app_plugins.Catalog'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
      security:
      - BearerAuth: []
      summary: List policy catalog
      tags:
      - catalog
  /v1/providers-catalog:
    get:
      description: Returns the catalog of supported LLM providers.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_catalog_response.ProviderResponse'
              type: array
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_NeuralTrust_TrustGate_pkg_api_handler_http_httpio.ErrorBody'
      security:
      - BearerAuth: []
      summary: List provider catalog
      tags:
      - catalog
  /v1/tenants/{tenant_id}/entitlements:
    put:
      consumes:
      - application/json
      description: 'Applies one entitlements stamp to every gateway of the tenant,
        for the control plane to call after a plan change. Platform JWT only (no tenant
        claim); a tenant JWT receives 422. Only the entitlements block is written
        — slug, metadata and telemetry are left untouched, so a re-stamp can never
        revert an edit made in the runtime. A downgrade is applied even when the tenant
        already has more gateways than the new MaxInstances: the response reports
        over_cap so the caller can warn, but the stamp is not refused, since refusing
        would strand every gateway of the tenant on the old plan. Idempotent.'
      parameters:
      - description: Tenant id
        in: path
        name: tenant_id
        required: true
        type: string
      - description: Entitlements stamp
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/pkg_api_handler_http_tenant.RestampEntitlementsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/pkg_api_handler_http_tenant.RestampEntitlementsResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Re-stamp plan entitlements across a tenant
      tags:
      - tenants
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
