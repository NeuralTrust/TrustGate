syntax = "proto3";

package snapshotpb;

option go_package = "github.com/NeuralTrust/TrustGate/pkg/infra/configsnapshot/proto;snapshotpb";

// StoreInstallations is the DP-initiated persistence channel for the MCP Store's
// per-principal install state. The data plane runs DB-less, so it computes the
// install decision locally (against the config snapshot's catalog + registries)
// and delegates the durable store writes it cannot make itself to the control
// plane, which owns the database: the per-principal store_installations rows and
// — for self-service — materialising the shared registry from the catalog. It
// rides the same egress-only connection the data plane already opens for
// ConfigSync: the data plane is always the client, so no inbound port is added
// to the data plane.
service StoreInstallations {
  // Upsert persists (creates or updates) one installation record.
  rpc Upsert(UpsertInstallationRequest) returns (UpsertInstallationResponse);
  // Find returns the installation for (gateway, principal, code); found=false
  // when there is no such row (the wire form of installation.ErrNotFound).
  rpc Find(FindInstallationRequest) returns (FindInstallationResponse);
  // ListByPrincipal returns everything a principal has installed on a gateway —
  // the CatalogScoper's read side.
  rpc ListByPrincipal(ListByPrincipalRequest) returns (ListInstallationsResponse);
  // Delete removes the installation for (gateway, principal, code); a missing
  // row surfaces as a NotFound status.
  rpc Delete(DeleteInstallationRequest) returns (DeleteInstallationResponse);
  // EnsureRegistry materialises the shared registry for a catalog code on the
  // control plane's database (the "created on first install" self-service path),
  // returning cleanly when one already exists. The new registry syncs back to the
  // data plane through the normal ConfigSync snapshot. The data plane cannot
  // write registries itself, so it delegates this to the control plane.
  rpc EnsureRegistry(EnsureRegistryRequest) returns (EnsureRegistryResponse);
}

// Installation mirrors installation.Installation on the wire. Timestamps are Unix
// seconds; an unset id/created/updated is filled by the control-plane repository.
message Installation {
  string id = 1;
  string gateway_id = 2;
  string principal_sub = 3;
  string catalog_code = 4;
  string status = 5;
  string installed_by = 6;
  map<string, string> config = 7;
  int64 created_at_unix = 8;
  int64 updated_at_unix = 9;
  // registry_id binds the install to one configured instance (registry) of its
  // code; empty = the code's canonical instance.
  string registry_id = 10;
  // reason is why the requester asked for the server, in their own words. It is
  // the whole substance of a pending request — an approver has nothing else to
  // decide on — so it has to survive the trip to the canonical store.
  string reason = 11;
  // requester_groups are the groups the requester carried when they filed, and
  // the only ones an approval may grant instead of the person.
  repeated string requester_groups = 12;
  // The admin's answer, kept so History survives the trip as well.
  string decision = 13;
  string decided_by = 14;
  int64 decided_at_unix = 15;
}

message UpsertInstallationRequest {
  Installation installation = 1;
}

message UpsertInstallationResponse {}

message FindInstallationRequest {
  string gateway_id = 1;
  string principal_sub = 2;
  string catalog_code = 3;
}

message FindInstallationResponse {
  bool found = 1;
  Installation installation = 2;
}

message ListByPrincipalRequest {
  string gateway_id = 1;
  string principal_sub = 2;
}

message ListInstallationsResponse {
  repeated Installation installations = 1;
}

message DeleteInstallationRequest {
  string gateway_id = 1;
  string principal_sub = 2;
  string catalog_code = 3;
}

message DeleteInstallationResponse {}

message EnsureRegistryRequest {
  string gateway_id = 1;
  string catalog_code = 2;
}

message EnsureRegistryResponse {}
