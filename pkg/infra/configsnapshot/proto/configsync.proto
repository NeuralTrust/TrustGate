syntax = "proto3";

package snapshotpb;

option go_package = "github.com/NeuralTrust/TrustGate/pkg/infra/configsnapshot/proto;snapshotpb";

// ConfigSync is the DP-initiated config-sync transport. The data plane dials the
// control plane (egress-only) and holds one long-lived Sync stream for change
// notices and acks; it pulls the compiled snapshot out-of-band via GetSnapshot.
service ConfigSync {
  // Sync is the long-lived control channel: the data plane sends Hello, then reads
  // VersionNotice messages and replies with Ack after each successful swap.
  rpc Sync(stream ClientMessage) returns (stream ServerMessage);

  // GetSnapshot streams the current compiled snapshot as ordered byte chunks. The
  // first message is a SnapshotHeader; when the applied version already matches the
  // header carries not_modified=true and no data chunks follow.
  rpc GetSnapshot(GetSnapshotRequest) returns (stream SnapshotChunk);
}

message ClientMessage {
  oneof msg {
    Hello hello = 1;
    Ack ack = 2;
    Heartbeat heartbeat = 3;
  }
}

message Hello {
  string instance_id = 1;
  string last_applied_version = 2;
  // accepts_usage says the data plane takes usage messages on this stream.
  // Older data planes leave it unset and get none, so a list larger than their
  // default receive limit cannot break their stream.
  bool accepts_usage = 3;
  // accepts_usage_changes says the data plane applies UsageChanges. The
  // control plane then sends a full UsageSnapshot once and, after it, only
  // the tenants that changed; without it every change resends the list.
  bool accepts_usage_changes = 4;
}

message Ack {
  string applied_version = 1;
}

// Heartbeat is sent right after Hello and then on an interval, so the control
// plane can tell a live data plane from a silent one and show what it runs.
// Control planes that predate it skip the message.
message Heartbeat {
  string version = 1;
  string region = 2;
  // deployment_type is saas or self-hosted.
  string deployment_type = 3;
  // trustguard_base_url is the TrustGuard the gateway's guardrail policies
  // call, from TRUSTGUARD_BASE_URL without credentials, query or fragment, and
  // trustguard_client_id the TRUSTGUARD_CLIENT_ID it presents there. The
  // client secret is never reported.
  string trustguard_base_url = 4;
  string trustguard_client_id = 5;
}

message ServerMessage {
  oneof msg {
    VersionNotice notice = 1;
    UsageSnapshot usage = 2;
    UsageChanges usage_changes = 3;
  }
}

// UsageSnapshot lists every tenant whose usage is exhausted, as the control
// plane knows it. A tenant missing from the list is healthy unless the data
// plane already holds a newer version for it than as_of_version, so a stream
// that reconnects to a control plane replica that is behind cannot undo a
// newer block. The control plane sends one on connect and again after every
// change, or only until its list is complete when the data plane accepts
// UsageChanges; data planes that predate it ignore the message.
message UsageSnapshot {
  repeated TenantUsage exhausted = 1;
  int64 as_of_version = 2;
}

// TenantUsage is the exhausted usage state of one tenant.
message TenantUsage {
  string tenant_id = 1;
  UsageReason reason = 2;
  // version comes from Usage System's global sequence and never decreases.
  int64 version = 3;
}

// UsageChanges carries the tenants whose usage state changed since the last
// usage message on the stream, healthy ones included: a tenant listed as
// healthy is unblocked. Each state applies only when it supersedes the one the
// data plane holds, so a repeated or older state changes nothing.
message UsageChanges {
  repeated TenantUsageState states = 1;
}

// TenantUsageState is the usage state of one tenant.
message TenantUsageState {
  string tenant_id = 1;
  UsageStatus status = 2;
  UsageReason reason = 3;
  // version comes from Usage System's global sequence and never decreases.
  int64 version = 4;
}

// UsageStatus is whether a tenant may be served.
enum UsageStatus {
  USAGE_STATUS_UNSPECIFIED = 0;
  USAGE_STATUS_HEALTHY = 1;
  USAGE_STATUS_EXHAUSTED = 2;
}

// UsageReason explains why a tenant is exhausted.
enum UsageReason {
  USAGE_REASON_UNSPECIFIED = 0;
  USAGE_REASON_FREE_LIMIT_REACHED = 1;
  USAGE_REASON_WALLET_EMPTY = 2;
}

message VersionNotice {
  string version = 1;
}

message GetSnapshotRequest {
  string applied_version = 1;
  string instance_id = 2;
}

message SnapshotChunk {
  oneof payload {
    SnapshotHeader header = 1;
    bytes data = 2;
  }
}

message SnapshotHeader {
  string version = 1;
  bool not_modified = 2;
  int64 total_bytes = 3;
}
