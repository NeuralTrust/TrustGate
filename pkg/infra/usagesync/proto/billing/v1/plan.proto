// Copy of the contract owned by the private event-schemas repository
// (proto/usage/v1). TrustGate is public and cannot depend on that module, so it
// carries the same package and field numbers; `make check-usagesync-contract`
// checks that the copy has not drifted.

syntax = "proto3";

package billing.v1;

option go_package = "github.com/NeuralTrust/TrustGate/pkg/infra/usagesync/proto/billing/v1;billingv1";

// Plan is the commercial plan of a tenant. Only this enum of billing.v1 is
// copied: it is the one usage.v1.UsageState refers to.
enum Plan {
  PLAN_UNSPECIFIED = 0;
  PLAN_FREE = 1;
  PLAN_STANDARD = 2;
  PLAN_ENTERPRISE = 3;
}
